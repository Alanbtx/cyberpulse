name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pytest -q
      - name: Auditoria de dependencias
        # PYSEC-2022-252: release maliciosa antiga do deep-translator (conta invadida em 2022).
        # O OSV nao lista versao corrigida, entao marca todas; a 1.11.4 fixada aqui e legitima.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-252

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Auditoria de dependencias
        run: npm audit --omit=dev --audit-level=high
